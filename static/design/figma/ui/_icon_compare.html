<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#d2e3e8;font-family:-apple-system,Helvetica,Arial,sans-serif;padding:20px}
.chips{display:flex;gap:14px;align-items:center;margin-bottom:24px}
button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 18px;border:0;border-radius:10px;background:#d2e3e8;font-size:14px;color:#000}
button.active{background:#000;color:#fff}
img.tab-icon{width:16px;height:16px;object-fit:contain}
.big{display:flex;gap:60px;align-items:flex-start;background:#d2e3e8}
.big img{width:220px;display:block}
.big .ref{image-rendering:pixelated}
.lbl{font-size:11px;color:#33424a}
</style></head><body>
<div class="chips">
<button class="active" type="button">Todas las propiedades</button>
<button type="button"><img class="tab-icon" src="icon-star.svg" alt=""> The Collection*</button>
<button type="button"><img class="tab-icon" src="icon-house.svg" alt=""> Casa Wynwood</button>
</div>
<div class="big">
  <div><img class="ref" src="_ref_house.png"><div class="lbl">Diseno (22x17 px) x10</div></div>
  <div><img src="icon-house.svg"><div class="lbl">Icono nuevo x10</div></div>
</div>
</body></html>
