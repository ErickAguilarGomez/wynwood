<div class="payment-field{% if field.errors %} is-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% if select_wrap %}<span class="payment-select-wrap">{{ field }}</span>{% else %}{{ field }}{% endif %}
    {% for error in field.errors %}<p class="payment-error">{{ error }}</p>{% endfor %}
</div>
